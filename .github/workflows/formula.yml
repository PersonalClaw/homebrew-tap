# Gate for the PersonalClaw formula.
#
# A GitHub-hosted macOS runner is a fresh machine per run, so this is the closest available
# stand-in for the "clean mac" the formula claims to work on — and it is the only place the
# formula can be exercised end to end. Homebrew on Linux refuses x86_64 CPUs without SSSE3,
# which rules out QEMU-emulated amd64 containers on Apple Silicon.
#
# Everything runs on ONE macOS job on purpose: `brew` is not on PATH on GitHub's
# ubuntu-latest images (measured — `brew: command not found`), so a separate cheap Linux
# lint job buys nothing, and `brew style` costs seconds on a runner that is already warm.
name: formula

on:
  push:
    branches: [main]
  pull_request:
  # Dependencies resolve at install time, so this formula can break without anyone
  # touching it. Check weekly rather than finding out from a user.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # One cop is skipped, deliberately and by name. FormulaAudit/InstallSteps asks every
      # formula to replace `def post_install` with the declarative `post_install_steps` DSL —
      # whose vocabulary is a fixed set of named actions (`create_symlink`,
      # `gtk_update_icon_cache`, …) with no way to run a command. This formula's post-install
      # has to create a virtualenv and resolve a dependency closure into it, so the
      # suggestion cannot be followed; `def post_install` is still the honoured hook. Skipping
      # it here rather than in a tap `.rubocop.yml` because `brew style` does not read one for
      # a formula given by path (measured), and an inline `# rubocop:disable` is itself a
      # style offence (Style/DisableCopsWithinSourceCodeDirective).
      - name: brew style
        run: brew style --except-cops=FormulaAudit/InstallSteps Formula/personalclaw.rb

      # Tap THIS checkout, not the published remote, so a pull request tests its own diff.
      # Installing the formula by path is refused outright ("Homebrew requires formulae to
      # be in a tap"), and going through a tap is also what a user actually does.
      - name: Tap this checkout
        run: brew tap PersonalClaw/tap "file://$PWD"

      - name: brew install personalclaw/tap/personalclaw
        run: brew install personalclaw/tap/personalclaw

      # Not redundant with the formula's own `test do` block: this asserts the binary is on
      # PATH through the symlink `brew link` made, which is what a user actually types.
      - name: personalclaw --version
        run: |
          which personalclaw
          personalclaw --version

      - name: brew test
        run: brew test personalclaw

      # The dashboard is bundled in the wheel. A formula that installed a gateway serving
      # no SPA would still pass --version, so assert the asset tree arrived.
      #
      # `libexec/venv/bin/python`, not `libexec/bin/python`: the venv sits one level down
      # because it is created in post_install, which is also where the staged sdist lives.
      - name: SPA is bundled
        run: |
          "$(brew --prefix personalclaw)/libexec/venv/bin/python" - <<'PY'
          import pathlib

          import personalclaw

          dist = pathlib.Path(personalclaw.__file__).parent / "static" / "dist"
          files = list(dist.rglob("*")) if dist.exists() else []
          print(f"SPA files: {len(files)}")
          assert files, f"no SPA bundled at {dist}"
          PY
